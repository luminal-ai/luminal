[package]
name = "test_runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
luminal = { path = "../.." }
# `luminal_reference` is ABSENT ENTIRELY — not a dependency, not a
# dev-dependency. This runtime owns everything it needs outright: its op
# vocabulary (see lib.rs) and its boundary contract (`bindings.rs`).
# Anything it turns out to want from another runtime gets REPLICATED here,
# never borrowed. The one exception is CUDA-lite, and only for the
# cuBLASLt marker estate — Train 3
# rehomed it to its executing runtime, and asserting on a fork of it
# would be asserting on a copy. This is a CPU-side dependency: CL
# compiles fully without its `device` feature.
luminal_cuda_lite = { path = "../../crates/luminal_cuda_lite" }
# Versions track luminal's Cargo.toml exactly — the egglog/egraph-serialize/
# petgraph types must UNIFY with luminal's so the fixture runners can hand
# this crate's egraphs to luminal's extractor and bufferizer.
egglog = { git = "https://github.com/luminal-ai/egglog", rev = "1bb30831e11121bd639caf93d84465d8d110e3f7" }
egraph-serialize = { version = "0.3.0", default-features = false, features = ["graphviz", "serde"]}
petgraph = "0.6.4"
rustc-hash = "2.1.1"
anyhow = "1.0"
# This crate owns its extractor + sampler copy (see src/extractor.rs).
rand = "0.9.2"
