name: Test Python Native

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

env:
    LUMINAL_LOG: "1"

jobs:
    python_native_tests:
        name: Python Native Tests
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/luminal-ai/luminal-docker:cpu
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v6
            - name: Update Rust toolchain
              run: rustup update
            - name: Build and test PyTorch reference backend
              run: bash crates/pytorch/run_tests.sh reference -v
