name: LLM chat
on:
  pull_request:
    branches: [logical-ssa-project, main]
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - 'crates/luminal_nn/**'
      - 'examples/llm_chat_cuda/**'
      - 'examples/llm_chat_metal/**'
      - 'crates/luminal_metal/**'
      - 'crates/luminal_cuda_lite/**'
      - 'crates/model_zoo/**'
      - '.github/workflows/llm-chat.yml'
  workflow_dispatch:
jobs:
  chat:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The CUDA example's `device` feature needs a CUDA toolkit, so CI
      # exercises its planning and host-side code only.
      - run: cargo clippy -p llm_chat_metal -p llm_chat_cuda --all-targets -- -D warnings
      - run: cargo test -p llm_chat_metal -p llm_chat_cuda
      - if: runner.os == 'macOS'
        run: cargo test -p luminal_metal --test resident_mutation --test dynamic_execution
