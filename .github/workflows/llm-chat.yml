name: LLM chat
on:
  pull_request:
    branches: [logical-ssa-project, main]
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - 'crates/luminal_nn/**'
      - 'examples/llm_chat/**'
      - 'examples/llm_chat_cuda/**'
      - 'examples/llm_chat_metal/**'
      - 'crates/luminal_metal/**'
      - 'crates/luminal_cuda_lite/**'
      - 'crates/model_zoo/**'
      - '.github/workflows/llm-chat.yml'
  workflow_dispatch:
jobs:
  shared:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo clippy -p llm_chat --all-targets -- -D warnings
      - run: cargo test -p llm_chat
  metal:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo clippy -p llm_chat_metal --all-targets -- -D warnings
      - run: cargo test -p llm_chat_metal
      - run: cargo test -p luminal_metal --test dynamic_execution
