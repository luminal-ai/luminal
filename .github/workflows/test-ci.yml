name: Test CI Workflows

on:
    push:
        branches: ["main"]
        paths: [".github/workflows/**", "ci/test_modal_workflows.py"]
    pull_request:
        branches: ["main"]
        paths: [".github/workflows/**", "ci/test_modal_workflows.py"]
    workflow_dispatch:

jobs:
    modal_workflow_tests:
        name: Modal workflow regression tests
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Install YAML parser
              run: python -m pip install PyYAML==6.0.3
            - name: Test Modal trigger and concurrency rules without GPUs
              run: python -m unittest discover -s ci -p test_modal_workflows.py -v
