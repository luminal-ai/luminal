[package]
name = "luminal"
version = "0.2.0"
edition.workspace = true
rust-version = "1.85"
description = "Deep learning at the speed of light."
license = "MIT OR Apache-2.0"

[dependencies]
itertools = "0.11.0"
num-traits = "0.2.16"
petgraph = "0.6.4"
rand = "0.9.2"
urlencoding = "2.1.2"
open = "5"
dyn-clone = "1.0.12"
half = {version="2.7.1", features=["num-traits", "bytemuck"]}
float8 = { version = "0.7", features = ["bytemuck", "num-traits"] }
tinyvec = { version = "1.6.0", features = ["serde"] }
colored = "2.0.4"
regex = "1.9.5"
rustc-hash = "2.1.1"
as-any = "0.3.1"
serde = { version = "1.0.202", features = ["derive"] }
generational-box = "0.5.6"
serde_json = "1.0.140"
egglog = {git="https://github.com/egraphs-good/egglog", rev="c2c0f1510a3633b768fb3d30ad284b211290e4b2"}
egglog-ast = {git="https://github.com/egraphs-good/egglog", rev="c2c0f1510a3633b768fb3d30ad284b211290e4b2"}
# egglog-reports: crate absorbed upstream; RunReport types re-export via egglog (pin bump 2026-08-11)
egraph-serialize = { version = "0.3.0", default-features = false, features = ["graphviz", "serde"]}
tracing = "0.1.43"
paste = "1.0.15"
pretty-duration = "0.1.1"
anyhow = "1.0"
graphviz-rust = { version = "0.9", default-features = false}
lru = "0.16.2"
rayon = "1.10"

[workspace.package]
edition = "2024"

[dev-dependencies]
# Step B (ruling 2026-08-17): core is runtime-neutral; its own test
# suites drive the reference runtime through this crate (a legal,
# standard dev-cycle). The self-dependency gives those #[cfg(test)]
# modules the DEP-WORLD `luminal::` name: a cyclic dev-dependency
# compiles the library twice (once plain for luminal_reference, once
# with cfg(test)), and the two builds' types do not unify — so tests
# that touch luminal_reference must build their inputs via `luminal::`
# (the same build luminal_reference links), never `crate::`.
luminal_reference = { path = "crates/luminal_reference" }
luminal = { path = "." }
luminal_nn = { path = "crates/luminal_nn" }
candle-core = "0.9.2"
candle-nn = "0.9.2"
ordered-float = "5.1.0"
proptest = "1.9.0"

[workspace]
# Runtime crates are re-seated on the native ladder as they become ready.
# Model-zoo members in this workspace are backend-neutral graph definitions;
# executable applications live under the corresponding runtime crate.
members = [
    "crates/luminal_cuda_lite",
    "crates/luminal_reference",
    "crates/luminal_nn",
    "crates/luminal_tracing",
    "examples/qwen3",
    "examples/llama3",
    "examples/paged_llama3",
    "examples/llama3_1_fp8",
    "examples/gemma3",
    "examples/qwen3_moe",
    "examples/gemma4_moe",
    "examples/whisper",
    "examples/yolo_v11",
    "examples/flux2",
    "examples/mini/llama3",
    "examples/mini/qwen3",
    "examples/mini/gemma3",
    "examples/mini/qwen3_moe",
    "examples/mini/gemma4_moe",
    "examples/mini/whisper",
    "examples/mini/conv",
    "examples/mini/flux",
    "tests/scalar_refs",
    "tests/test_runtime",
]

# Model examples are logical definitions only. Executable applications
# belong to runtime crates, which bind and run these backend-neutral graphs.

# Dependencies compile optimized even in dev builds: egglog's saturation
# engine at opt-level 0 is ~17x slower on search-heavy tests (mini_gemma3
# 559s debug vs 32s release), and deps are pinned so this cost is paid
# once. Workspace members keep fast incremental debug builds; dev-profile
# debug-assertions stay ON everywhere (this changes opt-level only).
[profile.dev.package."*"]
opt-level = 3

# LOCAL ENGINE PATCH: adds the atomic add_subsumed write
# (insert-born-retired) the vendored substitution walk needs — a copied
# subsumed row must never be live, even for one round (the orbit our
# :subsume termination discipline exists to prevent). The patched
# checkout's provenance and regeneration recipe: vendor/README.md.
# NEEDS A REAL HOME (fork or upstream, proposed alongside
# egglog-experimental #60) before this branch is shared.
[patch."https://github.com/egraphs-good/egglog"]
egglog = { path = "vendor/egglog-checkout" }
egglog-ast = { path = "vendor/egglog-checkout/egglog-ast" }
