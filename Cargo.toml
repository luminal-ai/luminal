[package]
name = "luminal"
version = "0.2.0"
edition.workspace = true
rust-version = "1.85"
description = "Deep learning at the speed of light."
license = "MIT OR Apache-2.0"

[dependencies]
itertools = "0.11.0"
num-traits = "0.2.16"
petgraph = "0.6.4"
rand = "0.9.2"
urlencoding = "2.1.2"
open = "5"
dyn-clone = "1.0.12"
half = {version="2.7.1", features=["num-traits", "bytemuck"]}
tinyvec = { version = "1.6.0", features = ["serde"] }
colored = "2.0.4"
regex = "1.9.5"
rustc-hash = "2.1.1"
as-any = "0.3.1"
serde = { version = "1.0.202", features = ["derive"] }
generational-box = "0.5.6"
serde_json = "1.0.140"
egglog = {git="https://github.com/egraphs-good/egglog.git", rev="9d58d2e4922b28c12aeb032420d09bae1df69718"}
egglog-ast = {git="https://github.com/egraphs-good/egglog.git", rev="9d58d2e4922b28c12aeb032420d09bae1df69718"}
egglog-reports = {git="https://github.com/egraphs-good/egglog.git", rev="9d58d2e4922b28c12aeb032420d09bae1df69718"}
egglog-experimental = { path = "../egglog-experimental", default-features = false }
egglog-static = { path = "../egglog-quote/static-macro" }
egraph-serialize = { version = "0.3.0", default-features = false, features = ["graphviz", "serde"]}
tracing = "0.1.43"
paste = "1.0.15"
pretty-duration = "0.1.1"
anyhow = "1.0"
graphviz-rust = { version = "0.9", default-features = false}
lru = "0.16.2"
rayon = "1.10"

[workspace.package]
edition = "2024"

[dev-dependencies]
candle-core = "0.9.2"
candle-nn = "0.9.2"
ordered-float = "5.1.0"
proptest = "1.9.0"

[workspace]
members = [
    "examples/*",
    "crates/luminal_nn",
    "crates/luminal_cuda_lite",
    "crates/luminal_metal",
    "crates/luminal_tracing",
    "crates/luminal_bench",
    "crates/luminal_python/rust",
]

[patch.crates-io]
candle-kernels = { git = "https://github.com/huggingface/candle.git", rev = "a0dbd8b8aef6bde9adca3e8ad90791609d64974b" }

# TEMPORARY (local dev, demo only): point the egglog family at the local
# egglog-quote checkout on branch `luminal-egglog-static-demo` (= luminal's
# pinned 9d58d2e + egglog-static). For the real branch, push that and bump the
# git revs above instead of patching.
[patch."https://github.com/egraphs-good/egglog.git"]
egglog = { path = "../egglog-quote" }
egglog-ast = { path = "../egglog-quote/egglog-ast" }
egglog-reports = { path = "../egglog-quote/egglog-reports" }
