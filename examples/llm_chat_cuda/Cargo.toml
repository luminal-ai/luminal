[package]
name = "llm_chat_cuda"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
llm_chat = { path = "../llm_chat" }
luminal = { path = "../.." }
luminal_cuda_lite = { path = "../../crates/luminal_cuda_lite", features = ["device"] }
cudarc = { git = "https://github.com/luminal-ai/cudarc.git", rev = "a42f3897b6d00aded8e6ac7ad258c72d8bad5596", features = ["cuda-version-from-build-system", "fallback-latest"] }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dev-dependencies]
luminal_reference = { path = "../../crates/luminal_reference" }
model_zoo = { path = "../../crates/model_zoo" }
