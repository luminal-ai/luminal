[package]
name = "llm_chat_cuda"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = []
# Device execution, exactly as the old `cuda_lite` feature gated it: with
# it off the crate still builds and plans everywhere, and `execute`
# refuses.
device = ["luminal_cuda_lite/device"]

[dependencies]
luminal = { path = "../.." }
luminal_cuda_lite = { path = "../../crates/luminal_cuda_lite" }
luminal_nn = { path = "../../crates/luminal_nn" }
model_zoo = { path = "../../crates/model_zoo" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = "2"
memmap2 = "0.9"
minijinja = { version = "2", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
rand = "0.9"
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[dev-dependencies]
luminal_reference = { path = "../../crates/luminal_reference" }
tempfile = "3"
