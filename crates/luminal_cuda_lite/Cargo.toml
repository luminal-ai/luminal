# CUDA-lite on the NATIVE LADDER (M4 re-seat, started 2026-08-17).
# The predecessor targeting the deleted HLIR pipeline is parked at
# ../luminal_cuda_lite_hlir as a parts library (NVRTC plumbing, kernel
# codegen patterns, cuBLASLt/FlashInfer/MoE estates) — salvage source,
# not scaffolding.
#
# The `device` feature gates everything that touches cudarc: with it
# OFF (the default on macOS) the crate builds everywhere and the
# plan/search layers are fully testable; `execute` refuses loudly.
[package]
name = "luminal_cuda_lite"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Train 3: the cuBLASLt host-call dispatch rides the same feature —
# cudarc's `cublaslt` module (result layer) joins the driver/NVRTC set.
device = ["dep:cudarc", "cudarc/cublaslt"]

[dependencies]
luminal = { path = "../.." }
anyhow = "1"
rustc-hash = "2"
# The runtime-owned extractor + search (Phase 1 of the #420/#422 rejoin).
# The petgraph version tracks luminal's exactly: the types must UNIFY with
# luminal's, since this crate's extractor consumes luminal's serialized
# e-graphs and produces luminal's ExtractedGraph. egraph-serialize is NOT
# pinned here — unification is guaranteed instead, by reaching it through
# `luminal::prelude::egraph_serialize`.
petgraph = "0.6.4"
rand = "0.9.2"
colored = "2.0.4"
cudarc = { version = "0.19.8", optional = true, features = ["cuda-version-from-build-system", "fallback-latest"] }

[dev-dependencies]
# Step B: the reference inventory the subset test pins against now lives
# in its own crate.
luminal_reference = { path = "../luminal_reference" }
# M4 Phase 5: the refusal-accounting ladder (the cycle-anatomy L1-L8
# discipline) runs the nn llama-block graphs through THIS runtime's
# search with views admitted.
luminal_nn = { path = "../luminal_nn" }
# Mini model crates are execution-smoke fixtures for this crate's test suite;
# CUDA Lite applications themselves use only the full model definitions below.
mini_conv = { path = "../../examples/mini/conv" }
mini_llama3 = { path = "../../examples/mini/llama3" }
mini_qwen3 = { path = "../../examples/mini/qwen3" }
mini_qwen3_moe = { path = "../../examples/mini/qwen3_moe" }
mini_whisper = { path = "../../examples/mini/whisper" }
mini_gemma3 = { path = "../../examples/mini/gemma3" }
mini_gemma4_moe = { path = "../../examples/mini/gemma4_moe" }
mini_flux = { path = "../../examples/mini/flux" }

# Full logical model definitions. Runtime-specific examples below this crate's
# examples/ directory bind and execute these backend-neutral graphs.
llama3 = { path = "../../examples/llama3" }
qwen3 = { path = "../../examples/qwen3" }
gemma3 = { path = "../../examples/gemma3" }
qwen3_moe = { path = "../../examples/qwen3_moe" }
gemma4_moe = { path = "../../examples/gemma4_moe" }
whisper = { path = "../../examples/whisper" }
yolo_v11 = { path = "../../examples/yolo_v11" }
flux2 = { path = "../../examples/flux2" }
