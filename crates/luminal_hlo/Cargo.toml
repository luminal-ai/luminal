[package]
name = "luminal_hlo"
version = "0.1.0"
edition = "2021"

[dependencies]
luminal = { path = "../.." }
luminal_nn = { path = "../luminal_nn" }
regex = "1.9.5"
anyhow = "1"
serde_json = "1.0"

[dev-dependencies]
dfdx = { version = "0.13", features = ["f16"] }
luminal_metal = { path = "../luminal_metal" }
serde = { version = "1.0", features = ["derive"] }
safetensors = "0.4"
image = "0.25"

[[example]]
name = "squeezenet"
path = "examples/squeezenet.rs"