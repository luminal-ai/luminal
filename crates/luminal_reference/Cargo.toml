# THE REFERENCE RUNTIME as a standalone crate (Step B of the runtime-
# ownership ruling, 2026-08-17): the trusted host executor, its op
# registry, and the reference-flavored defaulting conveniences
# (assembled_program, run_reference, the with_ops search wrapper).
# The core `luminal` crate is runtime-neutral — matchers and profilers
# always explicit — and dev-depends on this crate for its own test
# suites (a legal, standard dev-cycle).
[package]
name = "luminal_reference"
version = "0.1.0"
edition = "2024"

[dependencies]
luminal = { path = "../.." }
anyhow = "1"
rustc-hash = "2"
petgraph = "0.6.4"
# The runtime-owned search (Phase 1 of the #420/#422 rejoin): the genetic
# loop's RNG and the live progress report's colors, which used to be
# core's dependencies because the loop was.
rand = "0.9.2"
colored = "2.0.4"
float8 = { version = "0.7", features = ["bytemuck", "num-traits"] }
# Pin tracks the workspace Cargo.toml exactly (luminal-ai egglog fork).
egglog = { git = "https://github.com/luminal-ai/egglog", rev = "1bb30831e11121bd639caf93d84465d8d110e3f7" }
egraph-serialize = { version = "0.3.0", default-features = false, features = ["graphviz", "serde"]}

[dev-dependencies]
# The extractor copy's render-memo board hand-builds serialized e-nodes.
ordered-float = "5.1.0"
luminal_nn = { path = "../luminal_nn" }
mini_conv = { path = "../../examples/mini/conv" }
mini_flux = { path = "../../examples/mini/flux" }
mini_gemma3 = { path = "../../examples/mini/gemma3" }
mini_gemma4_moe = { path = "../../examples/mini/gemma4_moe" }
mini_llama3 = { path = "../../examples/mini/llama3" }
mini_qwen3 = { path = "../../examples/mini/qwen3" }
mini_qwen3_moe = { path = "../../examples/mini/qwen3_moe" }
mini_whisper = { path = "../../examples/mini/whisper" }
