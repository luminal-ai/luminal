[project]
name = "luminal_reference"
version = "0.1.0"
description = "Luminal reference (CPU) torch.compile backend"
requires-python = ">=3.10"
# numpy: `_tensor_bytes` stages a tensor through `.numpy().tobytes()`.
dependencies = ["torch>=2.14.0", "numpy>=2.0.2", "packaging>=23"]

# PyTorch 2.14 wheels require the CUDA 13.0 index; cu128 stops before 2.14.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
manifest-path = "Cargo.toml"
module-name = "luminal_reference._luminal"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "..", "../utils/tests"]
addopts = "--import-mode=importlib"
markers = ["slow: full-model or expensive operation coverage requiring explicit selection"]

[dependency-groups]
dev = ["pytest>=9", "maturin>=1,<2", "expecttest>=0.3", "hypothesis", "pytest-profiling", "pytest-subtests", "transformers>=4.40,<5.11", "diffusers>=0.35", "modal>=1.3.5", "safetensors"]
