[project]
name = "luminal_reference"
version = "0.1.0"
description = "Luminal reference (CPU) torch.compile backend"
requires-python = ">=3.10"
# numpy: `_tensor_bytes` stages a tensor through `.numpy().tobytes()`.
dependencies = ["torch>=2.10.0", "numpy>=2.0.2"]

# torch comes from the CUDA 12.8 index, matching crates/luminal_python: the
# default index's newest builds target CUDA 13 and cannot run on a 12.8 driver.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
manifest-path = "Cargo.toml"
module-name = "luminal_reference._luminal"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8", "maturin>=1.0,<2.0"]
