[project]
name = "luminal_cuda_lite"
version = "0.1.0"
description = "Luminal CUDA-lite torch.compile backend"
requires-python = ">=3.10"
# The PT2 export-preparation helpers are shared with the reference backend;
# `luminal_reference` is a build-time/runtime dependency until they are lifted
# into a backend-neutral package.
dependencies = ["torch>=2.14.0", "luminal_reference"]

# PyTorch 2.14 wheels require the CUDA 13.0 index; cu128 stops before 2.14.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
luminal_reference = { path = "../reference", editable = true }

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
manifest-path = "Cargo.toml"
module-name = "luminal_cuda_lite._luminal"
# A CUDA backend is not useful without device execution, so the wheel always
# builds with it on. `cargo check`/clippy on CUDA-free hosts still work because
# the *crate* default is off.
features = ["device"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "..", "../utils/tests"]
addopts = "--import-mode=importlib"
markers = ["slow: full-model or expensive operation coverage requiring explicit selection"]

[dependency-groups]
dev = ["pytest>=9", "maturin>=1,<2", "expecttest>=0.3", "hypothesis", "pytest-profiling", "pytest-subtests", "transformers>=4.40,<5.11", "diffusers>=0.35", "modal>=1.3.5", "safetensors"]
