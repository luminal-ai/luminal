[project]
name = "luminal_cuda_lite"
version = "0.1.0"
description = "Luminal CUDA-lite torch.compile backend"
requires-python = ">=3.10"
# The PT2 export-preparation helpers are shared with the reference backend;
# `luminal_reference` is a build-time/runtime dependency until they are lifted
# into a backend-neutral package.
dependencies = ["torch>=2.10.0", "luminal_reference"]

# torch comes from the CUDA 12.8 index, matching crates/luminal_python: the
# default index's newest builds target CUDA 13 and cannot run on a 12.8 driver.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
luminal_reference = { path = "../reference" }

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
manifest-path = "Cargo.toml"
module-name = "luminal_cuda_lite._luminal"
# A CUDA backend is not useful without device execution, so the wheel always
# builds with it on. `cargo check`/clippy on CUDA-free hosts still work because
# the *crate* default is off.
features = ["device"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8", "maturin>=1.0,<2.0"]
