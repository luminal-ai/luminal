[package]
name = "luminal_cuda_lite_py"
version = "0.1.0"
edition.workspace = true

[lib]
name = "luminal_cuda_lite_py"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The pyo3 wrapper owns no runtime of its own: it forwards to the CUDA-lite
# crate's `device` feature. OFF by default so a CUDA-free host can still
# `cargo check` the workspace and load the Python package far enough to see
# the runtime refuse loudly; `maturin develop --features device` builds the
# real GPU backend (see pyproject.toml, which turns the feature on for the
# wheel).
device = ["luminal_cuda_lite/device"]

[dependencies]
luminal = { path = "../../.." }
luminal_cuda_lite = { path = "../../luminal_cuda_lite" }
luminal_pytorch_utils = { path = "../utils" }
anyhow = "1"
rustc-hash = "2.1.1"

[dependencies.pyo3]
version = "0.28.0"
features = ["abi3-py38"]
