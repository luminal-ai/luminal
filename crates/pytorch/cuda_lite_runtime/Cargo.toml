[package]
name = "luminal_torch_cuda_lite_runtime"
version = "0.1.0"
edition.workspace = true

# The CUDA backend's torch runtime: the code object a compiled graph is, and
# the call path that runs one. It is everything a saved program needs at
# load. It runs no compiler: not the parser, the translator, search, or the
# kernel compiler. The CUDA compiler depends on this crate to build code
# objects; never the reverse.

[lib]
name = "luminal_torch_cuda_lite_runtime"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Device execution. OFF by default so a CUDA-free host can still check the
# workspace and read or write code objects; the wheel always builds with it
# on (see pyproject.toml).
device = ["luminal_cuda_lite/device"]

[dependencies]
luminal = { path = "../../.." }
luminal_cuda_lite = { path = "../../luminal_cuda_lite" }
luminal_torch_slots = { path = "../slots", features = ["python"] }
luminal_torch_code = { path = "../code", features = ["python"] }
anyhow = "1"
rustc-hash = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.pyo3]
version = "0.28.0"
features = ["abi3-py38"]
