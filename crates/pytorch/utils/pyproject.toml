[project]
name = "luminal_torch_common"
version = "0.1.0"
description = "The torch.compile frontend shared by the Luminal PyTorch backends"
requires-python = ">=3.10"
# packaging: `_torch_version` compares the installed torch against the minimum.
dependencies = ["torch>=2.14.0", "packaging>=23"]

# PyTorch 2.14 wheels require the CUDA 13.0 index; cu128 stops before 2.14.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/luminal_torch_common"]
