[package]
name = "luminal_cuda"
version = "0.2.0"
edition = "2021"
description = "Cuda compiler for luminal"
license = "MIT OR Apache-2.0"

[dependencies]
luminal = { path = "../.." }
cudarc = { version = "0.16.6", features = [
    "f16",
    "cuda-11080",  # Added CUDA 11.8 for better INT8 support
    "cuda-12080",  # Keep 12.8 for newer features
    "cudnn",       # Added cuDNN for better INT8 support
] }
itertools = "0.12.1"
rustc-hash = "2.1.1"
num-traits = "0.2.18"

[dev-dependencies]
rand = "0.9.2"
paste = "1.0.14"
luminal_nn = { path = "../../crates/luminal_nn" }