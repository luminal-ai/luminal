[package]
name = "luminal_snapshot"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Shared compact compiler snapshots for Luminal backends"

[dependencies]
egglog = { git = "https://github.com/luminal-ai/egglog", rev = "3787810fa259efc45237eecd98d7914a6b02256c", default-features = false }
egraph-serialize = { version = "0.3.0", default-features = false, features = ["serde"] }
indexmap = { version = "2.2", features = ["serde"] }
once_cell = "1.21"
ordered-float = { version = "5.0", features = ["serde"] }
rustc-hash = "2.1.1"
smallvec = "1.10"
serde = { version = "1", features = ["derive", "rc"] }

[features]
default = ["serde"]
serde = []
